<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerPoint Generator</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
<h1>📊 AI PowerPoint Generator</h1>
<p>Create presentation outlines instantly</p>
</header>

<div class="container">

<label>Grade Level</label>
<select>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
</select>

<label>Subject</label>
<input type="text" placeholder="Mathematics">

<label>Topic</label>
<input type="text" placeholder="Ratio and Proportion">

<button onclick="generatePPT()">Generate Presentation</button>

<div id="pptResult" class="hero" style="margin-top:20px;"></div>

<br>

<a href="index.html">⬅ Back to Dashboard</a>

</div>

<script>
function generatePPT(){

document.getElementById("pptResult").innerHTML=`

<h2>Presentation Outline</h2>

<ol>
<li>Title Slide</li>
<li>Learning Objectives</li>
<li>Motivation</li>
<li>Lesson Proper</li>
<li>Examples</li>
<li>Group Activity</li>
<li>Assessment</li>
<li>Reflection</li>
<li>Assignment</li>
</ol>

<p><b>Status:</b> Ready for future PPTX export.</p>

`;

}
</script>

</body>
</html>
