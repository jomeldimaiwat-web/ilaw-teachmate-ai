<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILAW Lesson Planner</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>📝 ILAW Lesson Planner</h1>
</header>

<div class="hero">

<h2>Create a Lesson Plan</h2>

<label>Grade Level</label><br>
<select>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
</select>

<br><br>
<label>Grade Level</label><br>
<input type="text" placeholder="Grade 7"><br><br>
<label>Subject</label><br>
<input type="text" placeholder="Mathematics">

<br><br>
<label>Quarter</label><br>
<input type="text" placeholder="Quarter 1"><br><br>
<label>Week</label><br>
<input type="text" placeholder="Week 1"><br><br>
<label>Topic</label><br>

<input type="text" placeholder="Ratio and Proportion">
<label>Learning Competency</label><br>
<input type="text" placeholder="Enter competency"><br><br>
<label>Duration</label><br>
<input type="text" placeholder="60 minutes"><br><br>

<label>Teaching Strategy</label><br>
<input type="text" placeholder="Collaborative Learning"><br><br>
<br><br>

<button>Generate Lesson Plan</button>

<br><br>

<a href="index.html">⬅ Back to Dashboard</a>

</div>

</body>
</html>
