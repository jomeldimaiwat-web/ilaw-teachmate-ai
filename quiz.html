<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Builder</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
<h1>🧠 AI Quiz Builder</h1>
<p>Create quizzes in seconds</p>
</header>

<div class="container">

<label>Grade Level</label>
<select>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
</select>

<label>Subject</label>
<input type="text" placeholder="Mathematics">

<label>Topic</label>
<input type="text" placeholder="Ratio and Proportion">

<label>Number of Questions</label>
<input type="number" value="10">

<label>Question Type</label>
<select>
<option>Multiple Choice</option>
<option>True or False</option>
<option>Identification</option>
<option>Mixed</option>
</select>

<button onclick="generateQuiz()">Generate Quiz</button>

<div id="quizResult" class="hero" style="margin-top:20px;"></div>

<br>

<a href="index.html">⬅ Back to Dashboard</a>

</div>

<script>
function generateQuiz(){

document.getElementById("quizResult").innerHTML=`

<h2>Sample Quiz</h2>

<ol>

<li>What is a ratio?
<br><br>
A. Comparison of two quantities
<br>
B. A polygon
<br>
C. A fraction only
<br>
D. An equation

<br><br>

<li>2:4 is equivalent to ________.

<br><br>

<li>True or False:
Ratios compare two quantities.

</ol>

<h3>Answer Key</h3>

1. A

2. 1:2

3. True

`;

}
</script>

</body>
</html>
